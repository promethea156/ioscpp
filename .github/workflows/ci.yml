name: CI

on:
  push:
    branches: [main]
    # A tag also runs the whole matrix, so the release is built and tested before
    # the release job below publishes it.
    tags: ["v*"]
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: >
          pipx run clang-format==19.1.1 --dry-run --Werror
          $(git ls-files '*.hpp' '*.cpp')

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DIOSCPP_BUILD_TESTS=ON
          -DIOSCPP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  # The install rules, the export set, and `ioscppConfig.cmake` are only valid if
  # a downstream `find_package(ioscpp)` consumer builds against them, so the build
  # is installed and a tiny consumer is configured, built, and run against it.
  package:
    name: package (find_package)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DIOSCPP_BUILD_TESTS=OFF
          -DIOSCPP_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix "${GITHUB_WORKSPACE}/install"

      - name: Configure the consumer
        run: >
          cmake -S tests/package -B consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/install"

      - name: Build the consumer
        run: cmake --build consumer --config Release

      # The USB backend links libusb, which is a shared library here, so the
      # loader has to find it in the install tree.
      - name: Run the consumer
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/install/lib
        run: ./consumer/ioscpp_package_consumer

  # The codecs parse bytes that come from a device, and malformed input must
  # return an error rather than crash, so the device-free suite runs under ASan
  # and UBSan with recovery disabled, and the first finding fails the job. The USB
  # backend is off: it cannot be exercised without a device, and instrumenting its
  # third-party dependency would only add noise.
  sanitizers:
    name: ASan+UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DIOSCPP_BUILD_TESTS=ON
          -DIOSCPP_BUILD_EXAMPLES=ON
          -DIOSCPP_BUILD_USB=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug

  # `IOSCPP_BUILD_USB=OFF` is the documented way for a consumer to build the core
  # with no USB dependency and supply its own `Transport`, so it is built and tested
  # on its own to keep the configuration from rotting.
  build-no-usb:
    name: core (USB off)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DIOSCPP_BUILD_TESTS=ON
          -DIOSCPP_BUILD_EXAMPLES=ON
          -DIOSCPP_BUILD_USB=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  release:
    name: release
    # Only on a tag, and only after the matrix has built and tested it on every
    # platform. The release notes are the tag's section of the changelog.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The notes are the section whose header names the tag, so a new
      # `## [Unreleased]` above it does not leak into the release.
      - name: Extract the release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## \[/ { if (found) exit; if (index($0, "[" substr(tag, 2) "]")) found = 1 }
            found
          ' CHANGELOG.md > notes.md

      # A `-` in the tag marks a pre-release, as SemVer says.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
